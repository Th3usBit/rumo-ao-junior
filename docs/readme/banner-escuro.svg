<g class="face primeira" style="animation-name:f0"><rect class="carta" x="470" y="56" width="370" height="214" rx="14"/><text class="mini" x="494" y="90">JavaScript e TypeScript</text><rect x="745.8268" y="76" width="70.17320000000001" height="22" rx="11" class="selo"/><text class="selo-t" x="780.9134" y="91" text-anchor="middle">Pergunta</text><text class="perg" x="494" y="138" style="white-space:pre">Quais são os valores falsy em</text><text class="perg" x="494" y="164" style="white-space:pre">JavaScript?</text><rect class="botao" x="494" y="212" width="322" height="36" rx="9"/><text class="botao-t" x="655" y="235" text-anchor="middle">Mostrar resposta  ·  Espaço</text></g><g class="face" style="animation-name:v0"><rect class="carta" x="470" y="56" width="370" height="214" rx="14"/><text class="mini" x="494" y="90">JavaScript e TypeScript</text><rect x="743.6119" y="76" width="72.38810000000001" height="22" rx="11" class="selo"/><text class="selo-t" x="779.8059499999999" y="91" text-anchor="middle">Resposta</text><text class="resp" x="494" y="132" style="white-space:pre"><tspan class="cod">false</tspan>, <tspan class="cod">0</tspan>, <tspan class="cod">-0</tspan>, <tspan class="cod">0n</tspan> (BigInt zero), <tspan class="cod">''</tspan> (string</text><text class="resp" x="494" y="154" style="white-space:pre">vazia), <tspan class="cod">null</tspan>, <tspan class="cod">undefined</tspan> e <tspan class="cod">NaN</tspan>. …</text><rect class="nota" x="494" y="214" width="74.5" height="34" rx="8"/><text class="nota-t" x="531.25" y="236" text-anchor="middle">1 · Errei</text><rect class="nota" x="576.5" y="214" width="74.5" height="34" rx="8"/><text class="nota-t" x="613.75" y="236" text-anchor="middle">2 · Difícil</text><rect class="nota" x="659" y="214" width="74.5" height="34" rx="8"/><text class="nota-t" x="696.25" y="236" text-anchor="middle">3 · Bom</text><rect class="nota" x="741.5" y="214" width="74.5" height="34" rx="8"/><text class="nota-t" x="778.75" y="236" text-anchor="middle">4 · Fácil</text></g><rect class="prog" x="470" y="284" width="370" height="3" rx="1.5" style="animation-name:p0"/>
<g class="face" style="animation-name:f1"><rect class="carta" x="470" y="56" width="370" height="214" rx="14"/><text class="mini" x="494" y="90">Spring Boot</text><rect x="745.8268" y="76" width="70.17320000000001" height="22" rx="11" class="selo"/><text class="selo-t" x="780.9134" y="91" text-anchor="middle">Pergunta</text><text class="perg" x="494" y="138" style="white-space:pre">O que <tspan class="cod">@Transactional</tspan> faz e quais</text><text class="perg" x="494" y="164" style="white-space:pre">os cuidados principais?</text><rect class="botao" x="494" y="212" width="322" height="36" rx="9"/><text class="botao-t" x="655" y="235" text-anchor="middle">Mostrar resposta  ·  Espaço</text></g><g class="face" style="animation-name:v1"><rect class="carta" x="470" y="56" width="370" height="214" rx="14"/><text class="mini" x="494" y="90">Spring Boot</text><rect x="743.6119" y="76" width="72.38810000000001" height="22" rx="11" class="selo"/><text class="selo-t" x="779.8059499999999" y="91" text-anchor="middle">Resposta</text><text class="resp" x="494" y="132" style="white-space:pre">Executa o método dentro de uma<tspan font-weight="650"> transação</tspan>:</text><text class="resp" x="494" y="154" style="white-space:pre">commit ao terminar;<tspan font-weight="650"> rollback</tspan> se uma</text><text class="resp" x="494" y="176" style="white-space:pre">exceção escapar. …</text><rect class="nota" x="494" y="214" width="74.5" height="34" rx="8"/><text class="nota-t" x="531.25" y="236" text-anchor="middle">1 · Errei</text><rect class="nota" x="576.5" y="214" width="74.5" height="34" rx="8"/><text class="nota-t" x="613.75" y="236" text-anchor="middle">2 · Difícil</text><rect class="nota" x="659" y="214" width="74.5" height="34" rx="8"/><text class="nota-t" x="696.25" y="236" text-anchor="middle">3 · Bom</text><rect class="nota" x="741.5" y="214" width="74.5" height="34" rx="8"/><text class="nota-t" x="778.75" y="236" text-anchor="middle">4 · Fácil</text></g><rect class="prog" x="470" y="284" width="370" height="3" rx="1.5" style="animation-name:p1"/>
