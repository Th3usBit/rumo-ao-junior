<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="titulo desc">
<title id="titulo">Rumo ao Júnior — sistema de estudo para a prova de efetivação</title>
<desc id="desc">Banner animado: o nome do projeto, a descrição e três flashcards reais do app (js-ts-005, spring-013, sql-011) virando da pergunta para a resposta.</desc>
<style>
svg{--bg:#1a1a19;--bg2:#222220;--borda:#2f2f2c;--tinta:#f4f4f1;--tinta2:#c3c2b7;--suave:#9c9a91;--grade:#2c2c2a;--base:#383835;--acento:#6da7ec;--acentoSuave:#16263d;--acentoTexto:#9ec5f4;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--o1:#86b6ef;--o2:#3987e5;--o3:#1c5cab;--neutro:#5a5954}
text{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;fill:var(--tinta)}
.cartao{fill:var(--bg);stroke:var(--borda)}
.t2{fill:var(--tinta2)} .suave{fill:var(--suave)} .acento{fill:var(--acento)}
.titulo{font-size:17px;font-weight:650} .sub{font-size:13px;fill:var(--tinta2)} .rot{font-size:13px}
.val{font-size:12.5px;font-variant-numeric:tabular-nums;fill:var(--tinta2)} .mini{font-size:12px;fill:var(--suave)}
.grade{stroke:var(--grade);stroke-width:1} .base{stroke:var(--base);stroke-width:1}
.s1{fill:var(--s1)} .s2{fill:var(--s2)} .s3{fill:var(--s3)} .s4{fill:var(--s4)} .s5{fill:var(--s5)} .s6{fill:var(--s6)}
.o1{fill:var(--o1)} .o2{fill:var(--o2)} .o3{fill:var(--o3)} .neutro{fill:var(--neutro)}
.bom{fill:#0ca30c} .critico{fill:#d03b3b} .aviso{fill:#fab219}
.cresce{transform-box:fill-box;transform-origin:left center;animation:cresce .9s cubic-bezier(.2,.7,.2,1) both}
.surge{animation:surge .6s ease-out both}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes surge{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.carta{fill:var(--bg);stroke:var(--borda);stroke-width:1.5}
.face{transform-box:fill-box;transform-origin:center;animation-duration:19.5s;animation-iteration-count:2;animation-timing-function:linear;opacity:0}
.primeira{opacity:1}
.perg{font-size:19px;font-weight:650} .resp{font-size:15px;fill:var(--tinta2)}
.cod{font-family:"Cascadia Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace;font-size:.9em;fill:var(--acentoTexto)}
.selo{fill:var(--acentoSuave)} .selo-t{font-size:11.5px;font-weight:650;fill:var(--acentoTexto)}
.botao{fill:#256abf} .botao-t{font-size:14px;font-weight:650;fill:#fff}
.nota{fill:var(--bg2);stroke:var(--borda)} .nota-t{font-size:12.5px;font-weight:600;fill:var(--tinta)}
.prog{fill:var(--acento);transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation-duration:19.5s;animation-iteration-count:2;animation-timing-function:linear}
.chip{fill:var(--bg2);stroke:var(--borda)} .chip-t{font-size:13px;font-weight:600;fill:var(--tinta2)}
.nome{font-size:40px;font-weight:750;letter-spacing:-0.02em} .tag{font-size:16.5px;fill:var(--tinta2)}
.brilho{stop-color:var(--acento)}
.logo{fill:#256abf}
.aro{fill:none;stroke:var(--acento);stroke-width:2;opacity:.35;transform-box:fill-box;transform-origin:center;animation:gira 39s linear 1}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes f0{0%{opacity:1;transform:none}16.41%{opacity:1;transform:scaleX(1)}17.54%{opacity:1;transform:scaleX(0)}17.59%{opacity:0}100%{opacity:0}}
@keyframes v0{0%,17.54%{opacity:0;transform:scaleX(0)}17.59%{opacity:1;transform:scaleX(0)}18.72%{opacity:1;transform:scaleX(1)}31.79%{opacity:1;transform:scaleX(1)}33.08%{opacity:0}100%{opacity:0}}
@keyframes p0{0%,0%{transform:scaleX(0)}33.08%{transform:scaleX(1)}33.13%,100%{transform:scaleX(0)}}
@keyframes f1{0%{opacity:0;transform:none}33.28%{opacity:0}33.33%{opacity:1;transform:scaleX(1)}49.74%{opacity:1;transform:scaleX(1)}50.87%{opacity:1;transform:scaleX(0)}50.92%{opacity:0}100%{opacity:0}}
@keyframes v1{0%,50.87%{opacity:0;transform:scaleX(0)}50.92%{opacity:1;transform:scaleX(0)}52.05%{opacity:1;transform:scaleX(1)}65.13%{opacity:1;transform:scaleX(1)}66.41%{opacity:0}100%{opacity:0}}
@keyframes p1{0%,33.33%{transform:scaleX(0)}66.41%{transform:scaleX(1)}66.46%,100%{transform:scaleX(0)}}
@keyframes f2{0%{opacity:0;transform:none}66.62%{opacity:0}66.67%{opacity:1;transform:scaleX(1)}83.08%{opacity:1;transform:scaleX(1)}84.21%{opacity:1;transform:scaleX(0)}84.26%{opacity:0}100%{opacity:0}}
@keyframes v2{0%,84.21%{opacity:0;transform:scaleX(0)}84.26%{opacity:1;transform:scaleX(0)}85.38%{opacity:1;transform:scaleX(1)}98.46%{opacity:1;transform:scaleX(1)}99.74%{opacity:0}100%{opacity:0}}
@keyframes p2{0%,66.67%{transform:scaleX(0)}99.74%{transform:scaleX(1)}99.79%,100%{transform:scaleX(0)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
