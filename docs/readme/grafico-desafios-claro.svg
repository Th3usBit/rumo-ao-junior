<svg xmlns="http://www.w3.org/2000/svg" width="880" height="679" viewBox="0 0 880 679" role="img" aria-labelledby="titulo desc">
<title id="titulo">17 desafios de simulado</title>
<desc id="desc">Buscador de CEP com histórico (Front-end, Desafio para casa, básico, 1h30); Catálogo de Pokémon com busca, filtro e paginação (Front-end, Desafio para casa, intermediário, 3h); Quadro Kanban com persistência (Front-end, Desafio para casa, intermediário, 3h); Cadastro em etapas com validação acessível (Front-end, Desafio para casa, básico, 2h); Explorador de usuários do GitHub (Front-end, Desafio para casa, intermediário, 2h30); API de transações e estatísticas em memória (Back-end, Desafio para casa, básico, 2h30, com gabarito); API de transferências simplificada (Back-end, Desafio para casa, intermediário, 4h); Encurtador de URLs (Back-end, Desafio para casa, básico, 2h); API de pedidos com baixa de estoque (Back-end, Desafio para casa, intermediário, 3h); Relatório de vendas a partir de CSV em Java puro (Back-end, Prova prática, básico, 1h30, com gabarito); Clientes e contatos 1:N (Fullstack, Desafio para casa, intermediário, 4h); Controle financeiro pessoal (Fullstack, Desafio para casa, intermediário, 4h); Enquetes com votação e resultados (Fullstack, Desafio para casa, avançado, 4h); Consultas SQL de um e-commerce (Núcleo comum, Prova prática, básico, 1h, com gabarito); Live coding: validador de senha com TDD (Núcleo comum, Live coding, básico, 45 min, com gabarito); Live coding: agrupar e ranquear pedidos (Núcleo comum, Live coding, básico, 40 min, com gabarito); Code review: encontre os problemas (Núcleo comum, Code review, intermediário, 40 min, com gabarito).</desc>
<style>
svg{--bg:#ffffff;--bg2:#f3f3ef;--borda:#e1e0d9;--tinta:#111110;--tinta2:#4a4945;--suave:#676660;--grade:#e1e0d9;--base:#c3c2b7;--acento:#256abf;--acentoSuave:#e5eefa;--acentoTexto:#184f95;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--o1:#184f95;--o2:#3987e5;--o3:#86b6ef;--neutro:#c3c2b7}
text{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;fill:var(--tinta)}
.cartao{fill:var(--bg);stroke:var(--borda)}
.t2{fill:var(--tinta2)} .suave{fill:var(--suave)} .acento{fill:var(--acento)}
.titulo{font-size:17px;font-weight:650} .sub{font-size:13px;fill:var(--tinta2)} .rot{font-size:13px}
.val{font-size:12.5px;font-variant-numeric:tabular-nums;fill:var(--tinta2)} .mini{font-size:12px;fill:var(--suave)}
.grade{stroke:var(--grade);stroke-width:1} .base{stroke:var(--base);stroke-width:1}
.s1{fill:var(--s1)} .s2{fill:var(--s2)} .s3{fill:var(--s3)} .s4{fill:var(--s4)} .s5{fill:var(--s5)} .s6{fill:var(--s6)}
.o1{fill:var(--o1)} .o2{fill:var(--o2)} .o3{fill:var(--o3)} .neutro{fill:var(--neutro)}
.bom{fill:#0ca30c} .critico{fill:#d03b3b} .aviso{fill:#fab219}
.cresce{transform-box:fill-box;transform-origin:left center;animation:cresce .9s cubic-bezier(.2,.7,.2,1) both}
.surge{animation:surge .6s ease-out both}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes surge{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gab{font-size:12px;font-weight:650;fill:var(--acentoTexto)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
