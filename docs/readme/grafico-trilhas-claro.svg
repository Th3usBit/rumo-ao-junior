<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-labelledby="titulo desc">
<title id="titulo">4 trilhas de estudo</title>
<desc id="desc">Núcleo Comum: 8 tópicos (7 de prioridade alta, 1 média, 0 baixa), 65 itens, 31 links; Front-end: 10 tópicos (8 de prioridade alta, 1 média, 1 baixa), 72 itens, 36 links; Back-end: 8 tópicos (5 de prioridade alta, 3 média, 0 baixa), 56 itens, 31 links; Fullstack: 6 tópicos (3 de prioridade alta, 3 média, 0 baixa), 32 itens, 20 links.</desc>
<style>
svg{--bg:#ffffff;--bg2:#f3f3ef;--borda:#e1e0d9;--tinta:#111110;--tinta2:#4a4945;--suave:#676660;--grade:#e1e0d9;--base:#c3c2b7;--acento:#256abf;--acentoSuave:#e5eefa;--acentoTexto:#184f95;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--o1:#184f95;--o2:#3987e5;--o3:#86b6ef;--neutro:#c3c2b7}
text{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;fill:var(--tinta)}
.cartao{fill:var(--bg);stroke:var(--borda)}
.t2{fill:var(--tinta2)} .suave{fill:var(--suave)} .acento{fill:var(--acento)}
.titulo{font-size:17px;font-weight:650} .sub{font-size:13px;fill:var(--tinta2)} .rot{font-size:13px}
.val{font-size:12.5px;font-variant-numeric:tabular-nums;fill:var(--tinta2)} .mini{font-size:12px;fill:var(--suave)}
.grade{stroke:var(--grade);stroke-width:1} .base{stroke:var(--base);stroke-width:1}
.s1{fill:var(--s1)} .s2{fill:var(--s2)} .s3{fill:var(--s3)} .s4{fill:var(--s4)} .s5{fill:var(--s5)} .s6{fill:var(--s6)}
.o1{fill:var(--o1)} .o2{fill:var(--o2)} .o3{fill:var(--o3)} .neutro{fill:var(--neutro)}
.bom{fill:#0ca30c} .critico{fill:#d03b3b} .aviso{fill:#fab219}
.cresce{transform-box:fill-box;transform-origin:left center;animation:cresce .9s cubic-bezier(.2,.7,.2,1) both}
.surge{animation:surge .6s ease-out both}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes surge{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<rect class="cartao" x="0.5" y="0.5" width="879" height="319" rx="16"/>

