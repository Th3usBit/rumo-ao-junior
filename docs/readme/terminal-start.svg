<text x="38" y="23" class="barra">Rumo ao Júnior — start.bat</text>
<text x="858" y="23" class="barra" text-anchor="end">✕</text>

<text class="linha" x="22" y="77" style="animation-name:l1">  ==============================================</text>
<text class="linha" x="22" y="96" style="animation-name:l2">   Rumo ao Júnior - sistema de estudo</text>
<text class="linha" x="22" y="115" style="animation-name:l3">  ==============================================</text>

<text class="linha opcao" x="22" y="153" style="animation-name:l5">   [1] Abrir o app no navegador (padrão)</text>
<text class="linha opcao" x="22" y="172" style="animation-name:l6">   [2] Rodar os testes automatizados</text>
<text class="linha opcao" x="22" y="191" style="animation-name:l7">   [3] Testes no modo visual (Playwright UI)</text>
<text class="linha opcao" x="22" y="210" style="animation-name:l8">   [4] Abrir o relatório dos últimos testes</text>
<text class="linha opcao" x="22" y="229" style="animation-name:l9">   [5] Abrir o manual de uso</text>

<text class="linha forte" x="22" y="267" style="animation-name:l11">   Escolha de 1 a 5 (o app abre sozinho em 8 segundos): <tspan class="digitado">1</tspan></text>

<text class="linha" x="22" y="305" style="animation-name:l13">  Iniciando o servidor local em http://localhost:3000</text>

<text class="linha" x="22" y="343" style="animation-name:l15">  - Deixe esta janela aberta enquanto estuda.</text>
<text class="linha" x="22" y="362" style="animation-name:l16">  - Para encerrar: feche a janela ou aperte Ctrl+C.</text>
<text class="linha" x="22" y="381" style="animation-name:l17">  - Use sempre este mesmo endereço: o progresso fica salvo por endereço.</text>

<rect class="cursor" x="24" y="387" width="8" height="16"/>
